<svg class="lucide lucide-globe" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#a7a7a7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .lucide-globe:hover { animation: globe-spin 2s linear; }
    .lucide-globe:hover circle { animation: globe-pulse 1s ease infinite; }
    @keyframes globe-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes globe-pulse { 0%,100% { r: 10; } 50% { r: 11; } }
  </style>
  <circle cx="12" cy="12" r="10"/>
  <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/>
  <path d="M2 12h20"/>
</svg>