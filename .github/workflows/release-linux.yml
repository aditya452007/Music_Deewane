name: Build & Release Linux

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "fastlane/**"
      - ".github/FUNDING.yml"
      - "ghpage/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        timeout-minutes: 10
        run: |
          for i in 1 2 3; do
            sudo apt-get update && break
            sleep 10
          done
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          V_TAG="${VERSION}+${{ github.run_number }}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "V_TAG=${V_TAG}" >> $GITHUB_OUTPUT

      - name: Build Linux
        run: flutter build linux --release --build-number ${{ github.run_number }}

      - name: Package Linux build
        run: |
          tar -czf "music_deewane_linux_x64_v${{ steps.version.outputs.V_TAG }}.tar.gz" -C build/linux/x64/release/bundle .
          # Write version info for updater verification
          cat > "music_deewane_linux_x64_v${{ steps.version.outputs.V_TAG }}_version.json" << EOF
          {
            "version": "${{ steps.version.outputs.VERSION }}",
            "build": "${{ github.run_number }}",
            "tag": "v${{ steps.version.outputs.V_TAG }}",
            "commit": "${{ github.sha }}",
            "platform": "linux"
          }
          EOF

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-assets-linux
          path: music_deewane_linux_*.tar.gz

      - name: Create/Update GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.version.outputs.V_TAG }}
          name: Music Deewane v${{ steps.version.outputs.V_TAG }}
          commit: ${{ github.sha }}
          body: |
            ## Music Deewane v${{ steps.version.outputs.VERSION }} (Linux)

            - **Version:** ${{ steps.version.outputs.VERSION }}
            - **Tag:** v${{ steps.version.outputs.V_TAG }}
            - **Build:** #${{ github.run_number }}
            - **Commit:** ${{ github.sha }}

            ### Linux Downloads
            | Platform | File |
            |----------|------|
            | Linux (x64) | music_deewane_linux_x64_v${{ steps.version.outputs.V_TAG }}.tar.gz |
          artifacts: music_deewane_linux_*.tar.gz music_deewane_linux_*_version.json
          token: ${{ github.token }}
          allowUpdates: true
          replacesArtifacts: false
          makeLatest: legacy
