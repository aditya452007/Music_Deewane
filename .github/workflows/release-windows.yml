name: Build & Release Windows

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "fastlane/**"
      - ".github/FUNDING.yml"
      - "ghpage/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows Build & Release
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' | Select-Object -First 1
          if (-not $line) { throw "version not found in pubspec.yaml" }
          $ver = $line.Matches[0].Groups[1].Value.Split('+')[0]
          $vtag = "$ver+${{ github.run_number }}"
          "VERSION=$ver" >> $env:GITHUB_OUTPUT
          "V_TAG=$vtag" >> $env:GITHUB_OUTPUT

      - name: Build Windows
        run: flutter build windows --release --build-number ${{ github.run_number }}

      - name: Create MSIX
        run: dart run msix:create --version ${{ steps.version.outputs.VERSION }}.0

      - name: Install Inno Setup
        run: winget install JRSoftware.InnoSetup --accept-package-agreements --accept-source-agreements

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: Start-Process -FilePath 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' -ArgumentList 'installer\windows\music_deewane.iss' -Wait -NoNewWindow

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.V_TAG }}"
          $releaseDir = "build/windows/x64/runner/Release"
          Compress-Archive -Path "$releaseDir/*" -DestinationPath "windows_artifacts/music_deewane_windows_v${v}.zip"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-assets-windows
          path: windows_artifacts/*

      - name: Create/Update GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.version.outputs.V_TAG }}
          name: Music Deewane v${{ steps.version.outputs.V_TAG }}
          commit: ${{ github.sha }}
          body: |
            ## Music Deewane v${{ steps.version.outputs.VERSION }} (Windows)

            - **Version:** ${{ steps.version.outputs.VERSION }}
            - **Tag:** v${{ steps.version.outputs.V_TAG }}
            - **Build:** #${{ github.run_number }}
            - **Commit:** ${{ github.sha }}

            ### Windows Downloads
            | Platform | File |
            |----------|------|
            | Windows (x64) Portable | music_deewane_windows_v${{ steps.version.outputs.V_TAG }}.zip |
            | Windows (x64) MSIX | music_deewane.msix |
            | Windows (x64) Installer | MusicDeewaneSetup_${{ steps.version.outputs.VERSION }}.exe |
          artifacts: |
            windows_artifacts/music_deewane_windows_*.zip
            windows_artifacts/music_deewane.msix
            windows_artifacts/MusicDeewaneSetup_*.exe
          token: ${{ github.token }}
          allowUpdates: true
          replacesArtifacts: false
          makeLatest: legacy
