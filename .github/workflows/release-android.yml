name: Build & Release Android

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "fastlane/**"
      - ".github/FUNDING.yml"
      - "ghpage/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Android Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          V_TAG="${VERSION}+${{ github.run_number }}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "V_TAG=${V_TAG}" >> $GITHUB_OUTPUT

      - name: Restore signing keystore
        run: |
          if [ -n "$KEY_STORE_B64" ]; then
            echo "$KEY_STORE_B64" | base64 -d > android/bloomee.jks
            cat << EOF > android/key.properties
          keyPassword=$KEY_PASSWORD
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF
            echo "Keystore restored"
          else
            echo "No keystore - using debug signing"
          fi
        env:
          KEY_STORE_B64: ${{ secrets.KEY_STORE }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Build Android APK
        run: flutter build apk --release --build-number ${{ github.run_number }}

      - name: Package Android APK
        run: |
          V_TAG="${{ steps.version.outputs.V_TAG }}"
          APK_DIR="build/app/outputs/flutter-apk"
          cp "$APK_DIR/app-release.apk" "music_deewane_android_v${V_TAG}.apk"
          # Write version info for updater verification
          cat > "music_deewane_android_v${V_TAG}_version.json" << EOF
          {
            "version": "${{ steps.version.outputs.VERSION }}",
            "build": "${{ github.run_number }}",
            "tag": "v${{ steps.version.outputs.V_TAG }}",
            "commit": "${{ github.sha }}",
            "platform": "android"
          }
          EOF

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-assets-android
          path: music_deewane_android_v*.apk

      - name: Create/Update GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.version.outputs.V_TAG }}
          name: Music Deewane v${{ steps.version.outputs.V_TAG }}
          commit: ${{ github.sha }}
          body: |
            ## Music Deewane v${{ steps.version.outputs.VERSION }} (Android)

            - **Version:** ${{ steps.version.outputs.VERSION }}
            - **Tag:** v${{ steps.version.outputs.V_TAG }}
            - **Build:** #${{ github.run_number }}
            - **Commit:** ${{ github.sha }}

            ### Android Downloads
            | Platform | File |
            |----------|------|
            | Android | music_deewane_android_v${{ steps.version.outputs.V_TAG }}.apk |
          artifacts: music_deewane_android_v*.apk music_deewane_android_v*_version.json
          token: ${{ github.token }}
          allowUpdates: true
          replacesArtifacts: false
          makeLatest: legacy
