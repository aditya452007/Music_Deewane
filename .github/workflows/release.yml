name: Build & Release All Platforms

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "fastlane/**"
      - ".github/FUNDING.yml"
      - "ghpage/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' | Select-Object -First 1
          if (-not $line) { throw "version not found in pubspec.yaml" }
          $ver = $line.Matches[0].Groups[1].Value.Split('+')[0]
          $vtag = "$ver-${{ github.run_number }}"
          "VERSION=$ver" >> $env:GITHUB_OUTPUT
          "V_TAG=$vtag" >> $env:GITHUB_OUTPUT

      - name: Build Windows
        run: flutter build windows --release --build-number ${{ github.run_number }}

      - name: Install Inno Setup
        run: winget install JRSoftware.InnoSetup --accept-package-agreements --accept-source-agreements

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: Start-Process -FilePath 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' -ArgumentList 'installer\windows\music_deewane.iss' -Wait -NoNewWindow

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.V_TAG }}"
          $releaseDir = "build/windows/x64/runner/Release"
          New-Item -ItemType Directory -Force -Path windows_artifacts | Out-Null
          @{
            version = "${{ steps.version.outputs.VERSION }}"
            build = "${{ github.run_number }}"
            tag = "v${{ steps.version.outputs.V_TAG }}"
            commit = "${{ github.sha }}"
            platform = "windows"
          } | ConvertTo-Json | Set-Content -Path "$releaseDir/version.json"
          Compress-Archive -Path "$releaseDir/*" -DestinationPath "windows_artifacts/music_deewane_windows_v${v}.zip"

      - name: Create MSIX
        run: dart run msix:create --version ${{ steps.version.outputs.VERSION }}.0

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-assets-windows
          path: windows_artifacts/*

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          V_TAG="${VERSION}-${{ github.run_number }}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "V_TAG=${V_TAG}" >> $GITHUB_OUTPUT

      - name: Restore signing keystore
        run: |
          if [ -n "$KEY_STORE_B64" ]; then
            echo "$KEY_STORE_B64" | base64 -d > android/bloomee.jks
            cat << EOF > android/key.properties
          keyPassword=$KEY_PASSWORD
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF
            echo "Keystore restored"
          else
            echo "No keystore - using debug signing"
          fi
        env:
          KEY_STORE_B64: ${{ secrets.KEY_STORE }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Build Android APK
        run: flutter build apk --release --build-number ${{ github.run_number }}

      - name: Package Android APK
        run: |
          V_TAG="${{ steps.version.outputs.V_TAG }}"
          APK_DIR="build/app/outputs/flutter-apk"
          cp "$APK_DIR/app-release.apk" "music_deewane_android_v${V_TAG}.apk"
          cat > "music_deewane_android_v${V_TAG}_version.json" << EOF
          {
            "version": "${{ steps.version.outputs.VERSION }}",
            "build": "${{ github.run_number }}",
            "tag": "v${{ steps.version.outputs.V_TAG }}",
            "commit": "${{ github.sha }}",
            "platform": "android"
          }
          EOF

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-assets-android
          path: music_deewane_android_v*.apk

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        timeout-minutes: 10
        run: |
          for i in 1 2 3; do
            sudo apt-get update && break
            sleep 10
          done
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          V_TAG="${VERSION}-${{ github.run_number }}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "V_TAG=${V_TAG}" >> $GITHUB_OUTPUT

      - name: Build Linux
        run: flutter build linux --release --build-number ${{ github.run_number }}

      - name: Package Linux build
        run: |
          tar -czf "music_deewane_linux_x64_v${{ steps.version.outputs.V_TAG }}.tar.gz" -C build/linux/x64/release/bundle .
          cat > "music_deewane_linux_x64_v${{ steps.version.outputs.V_TAG }}_version.json" << EOF
          {
            "version": "${{ steps.version.outputs.VERSION }}",
            "build": "${{ github.run_number }}",
            "tag": "v${{ steps.version.outputs.V_TAG }}",
            "commit": "${{ github.sha }}",
            "platform": "linux"
          }
          EOF

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-assets-linux
          path: music_deewane_linux_*.tar.gz

  release:
    name: Create GitHub Release
    needs: [build-windows, build-android, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Download All Artifacts
        uses: actions/download-artifact@v6
        with:
          path: all-artifacts
          pattern: release-assets-*

      - name: Flatten artifacts
        run: |
          mkdir -p release-artifacts
          find all-artifacts -type f -not -path '*/\.*' -exec cp {} release-artifacts/ \;
          ls -la release-artifacts/

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          V_TAG="${VERSION}-${{ github.run_number }}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "V_TAG=${V_TAG}" >> $GITHUB_OUTPUT

      - name: Create/Update GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.version.outputs.V_TAG }}
          name: Music Deewane v${{ steps.version.outputs.V_TAG }}
          commit: ${{ github.sha }}
          body: |
            ## Music Deewane v${{ steps.version.outputs.VERSION }}

            - **Version:** ${{ steps.version.outputs.VERSION }}
            - **Tag:** v${{ steps.version.outputs.V_TAG }}
            - **Build:** #${{ github.run_number }}
            - **Commit:** ${{ github.sha }}

            ### Downloads
            | Platform | File |
            |----------|------|
            | Windows (x64) Portable | music_deewane_windows_v${{ steps.version.outputs.V_TAG }}.zip |
            | Windows (x64) MSIX | music_deewane.msix |
            | Windows (x64) Installer | MusicDeewaneSetup_${{ steps.version.outputs.VERSION }}.exe |
            | Android | music_deewane_android_v${{ steps.version.outputs.V_TAG }}.apk |
            | Linux (x64) | music_deewane_linux_x64_v${{ steps.version.outputs.V_TAG }}.tar.gz |
          artifacts: release-artifacts/*
          token: ${{ github.token }}
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          draft: false
          prerelease: false
