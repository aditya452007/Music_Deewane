<svg class="lucide lucide-list-music" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#a7a7a7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .lucide-list-music:hover circle { animation: note-spin 1s ease; }
